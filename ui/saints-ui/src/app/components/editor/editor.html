<div class="editor-container">
  <header class="editor-header">
    <h1>{{ draftId ? 'Edit Post' : 'New Post' }}</h1>
    <div class="header-actions">
      <button class="btn-secondary" (click)="cancel()" [disabled]="isSaving">
        Cancel
      </button>
      <button class="btn-primary" (click)="saveDraft()" [disabled]="isSaving || isLoading">
        {{ isSaving ? 'Saving...' : 'Save Draft' }}
      </button>
    </div>
  </header>

  <div class="editor-content">
    <div class="loading" *ngIf="isLoading">
      Loading draft...
    </div>

    <div class="error-message" *ngIf="error">
      {{ error }}
    </div>

    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>

    <div class="editor-form" *ngIf="!isLoading">
      <div class="form-group">
        <label for="title">Title</label>
        <input
          type="text"
          id="title"
          [(ngModel)]="title"
          placeholder="Enter post title..."
          [disabled]="isSaving"
        />
      </div>

      <div class="form-group">
        <label for="content">Content (Markdown)</label>
        <textarea
          id="content"
          [(ngModel)]="content"
          placeholder="Write your post in Markdown format..."
          [disabled]="isSaving"
          rows="20"
        ></textarea>
        <p class="help-text">
          You can use Markdown formatting: **bold**, *italic*, # Heading, - List items, etc.
        </p>
      </div>
    </div>
  </div>
</div>
