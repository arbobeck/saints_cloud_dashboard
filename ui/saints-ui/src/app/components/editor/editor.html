<div class="editor-container">
  <header class="editor-header">
    <h1>{{ draftId ? 'Edit Post' : 'New Post' }}</h1>
    <div class="header-actions">
      <button class="btn-secondary" (click)="cancel()" [disabled]="isSaving">
        Cancel
      </button>
      <button class="btn-primary" (click)="saveDraft()" [disabled]="isSaving || isLoading">
        {{ isSaving ? 'Saving...' : 'Save Draft' }}
      </button>
    </div>
  </header>

  <div class="editor-content">
    @if (isLoading) {
      <div class="loading">
        Loading draft...
      </div>
    }

    @if (error) {
      <div class="error-message">
        {{ error }}
      </div>
    }

    @if (successMessage) {
      <div class="success-message">
        {{ successMessage }}
      </div>
    }

    @if (!isLoading) {
      <div class="editor-form">
        <div class="form-group">
          <label for="title">Title</label>
          <input
            type="text"
            id="title"
            [(ngModel)]="title"
            placeholder="Enter post title..."
            [disabled]="isSaving"
            />
        </div>
        <div class="form-group">
          <label for="content">Content (Markdown)</label>
          <textarea
            id="content"
            [(ngModel)]="content"
            placeholder="Write your post in Markdown format..."
            [disabled]="isSaving"
            rows="20"
          ></textarea>
          <p class="help-text">
            You can use Markdown formatting: **bold**, *italic*, # Heading, - List items, etc.
          </p>
        </div>
      </div>
    }
  </div>
</div>
