<div class="dashboard-container">
  <h1>Saints & Feast Days Dashboard</h1>

  <!-- Saints Table -->
  <section class="saints-section">
    <h2>Saints</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Feast Day</th>
          <th>Patronage</th>
        </tr>
      </thead>
      <tbody>
  <!-- Loading Spinner Row -->
  <tr *ngIf="loadingSaints">
    <td colspan="4" class="spinner-cell">
      <app-loading-spinner></app-loading-spinner>
    </td>
  </tr>

  <!-- Error Message Row -->
  <tr *ngIf="errorSaints">
    <td colspan="4">
      <app-error-message [message]="errorSaints"></app-error-message>
    </td>
  </tr>

  <!-- Data Rows -->
  <ng-container *ngIf="!loadingSaints && !errorSaints">
    <tr *ngFor="let saint of saints">
      <td>{{ saint.id }}</td>
      <td>{{ saint.name }}</td>
      <td>{{ saint.feastDay | date:'longDate' }}</td>
      <td>{{ saint.patronages }}</td>
    </tr>
  </ng-container>
</tbody>

    </table>
  </section>

  <!-- History Table -->
  <section class="history-section">
    <h2>Church History</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Year</th>
        </tr>
      </thead>
 <tbody>
  <!-- Loading Spinner Row -->
  <tr *ngIf="loadingHistory">
    <td colspan="3" class="spinner-cell">
      <app-loading-spinner></app-loading-spinner>
    </td>
  </tr>

  <!-- Error Message Row -->
  <tr *ngIf="errorHistory">
    <td colspan="3">
      <app-error-message [message]="errorHistory"></app-error-message>
    </td>
  </tr>

  <!-- Data Rows -->
  <ng-container *ngIf="!loadingHistory && !errorHistory">
    <tr *ngFor="let h of history">
      <td>{{ h.id }}</td>
      <td>{{ h.name }}</td>
      <td>{{ h.year }}</td>
    </tr>
  </ng-container>
</tbody>
    </table>
  </section>
</div>
