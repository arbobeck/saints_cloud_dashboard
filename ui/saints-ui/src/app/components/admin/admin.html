<div class="admin-container">
  <header class="admin-header">
    <h1>Blog Dashboard</h1>
    <div class="header-actions">
      <button class="btn-primary" (click)="createNew()">
        + New Post
      </button>
      <button class="btn-secondary" (click)="logout()">
        Logout
      </button>
    </div>
  </header>

  <div class="admin-content">
    <div class="loading" *ngIf="isLoading">
      Loading drafts...
    </div>

    <div class="error-message" *ngIf="error">
      {{ error }}
    </div>

    <div class="drafts-grid" *ngIf="!isLoading && !error">
      <div class="empty-state" *ngIf="drafts.length === 0">
        <p>No blog posts yet.</p>
        <button class="btn-primary" (click)="createNew()">
          Create Your First Post
        </button>
      </div>

      <div class="draft-card" *ngFor="let draft of drafts">
        <div class="draft-header">
          <h3>{{ draft.title }}</h3>
          <span class="draft-status" [class.published]="draft.status === 'published'">
            {{ draft.status }}
          </span>
        </div>
        
        <div class="draft-meta">
          <span>Created: {{ formatDate(draft.createdAt) }}</span>
          <span>Updated: {{ formatDate(draft.updatedAt) }}</span>
        </div>

        <div class="draft-content-preview">
          {{ draft.content.substring(0, 150) }}{{ draft.content.length > 150 ? '...' : '' }}
        </div>

        <div class="draft-actions">
          <button class="btn-edit" (click)="editDraft(draft.id)">
            Edit
          </button>
          <button class="btn-delete" (click)="deleteDraft(draft.id, draft.title)">
            Delete
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
