networks:
  saints-net:

volumes:
  dotnet-tools:
  dotnet-packages:
  postgres-data:

services:
  saints-postgres:
    image: postgres:16-alpine
    container_name: saints-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saintsuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-saintsdb}
    ports:
      - "5432:5432"
    networks:
      - saints-net
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docs:/docs
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saintsuser} -d ${POSTGRES_DB:-saintsdb}"]
      interval: 5s
      retries: 12
      start_period: 10s
      timeout: 5s

  saints-ef:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: saints-ef
    depends_on:
      saints-postgres:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./api/SaintsApi:/app
      - dotnet-tools:/root/.dotnet/tools
      - dotnet-packages:/root/.nuget/packages
    environment:
      ConnectionStrings__SaintsDb: "Host=saints-postgres;Database=${POSTGRES_DB:-saintsdb};Username=${POSTGRES_USER:-saintsuser};Password=${POSTGRES_PASSWORD}"
    entrypoint: ["bash", "-c"]
    command: >
      "dotnet restore &&
       dotnet tool install --global dotnet-ef --version 8.0.0 2>/dev/null || echo 'EF already installed' &&
       export PATH=\"$PATH:/root/.dotnet/tools\" &&
       echo 'Running migrations...' &&
       dotnet ef database update"
    networks:
      - saints-net

  saints-seed:
    image: postgres:16-alpine
    container_name: saints-seed
    depends_on:
      saints-ef:
        condition: service_completed_successfully
    volumes:
      - ./docs:/docs
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    entrypoint: ["sh", "-c"]
    command: >
      "until psql -h saints-postgres -U ${POSTGRES_USER:-saintsuser} -d ${POSTGRES_DB:-saintsdb} -c 'SELECT 1 FROM \"Saints\" LIMIT 1;' 2>/dev/null; do
         echo 'Waiting for Saints table...'
         sleep 2
       done &&
       echo 'Running seed script...' &&
       psql -h saints-postgres -U ${POSTGRES_USER:-saintsuser} -d ${POSTGRES_DB:-saintsdb} -f /docs/seed_saints_history_postgres.sql &&
       echo 'Seed complete!'"
    networks:
      - saints-net

  saints-tests:
    profiles: ["dev"]
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: saints-tests
    working_dir: /app
    volumes:
      - ./api:/app
      - dotnet-packages:/root/.nuget/packages
    command: >
      bash -c "dotnet restore && dotnet build && dotnet test --logger console"
    networks:
      - saints-net

  saints_api_dev:
    profiles: ["dev"]
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: saints-api
    depends_on:
      saints-postgres:
        condition: service_healthy
      saints-seed:
        condition: service_completed_successfully
      saints-tests:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ./api/SaintsApi:/app
      - dotnet-packages:/root/.nuget/packages
    entrypoint: ["bash", "-c"]
    command: >
      "dotnet restore &&
       dotnet build &&
       dotnet run --urls http://0.0.0.0:5000"
    ports:
      - "5000:5000"
    networks:
      - saints-net
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__SaintsDb: "Host=saints-postgres;Database=${POSTGRES_DB:-saintsdb};Username=${POSTGRES_USER:-saintsuser};Password=${POSTGRES_PASSWORD}"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/saints || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  saints_api_prod:
    profiles: ["prod"]
    image: ghcr.io/arbobeck/saints-api:latest
    container_name: saints-api-prod
    depends_on:
      saints-postgres:
        condition: service_healthy
      saints-seed:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__SaintsDb: "Host=saints-postgres;Database=${POSTGRES_DB:-saintsdb};Username=${POSTGRES_USER:-saintsuser};Password=${POSTGRES_PASSWORD}"
    ports:
      - "5000:5000"
    networks:
      - saints-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/saints || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  angular_client_dev:
    profiles: ["dev"]
    build:
      context: ./ui/saints-ui
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:5000}
    container_name: angular-client
    ports:
      - "${ANGULAR_PORT:-4200}:4200"
    networks:
      - saints-net
    depends_on:
      saints_api_dev:
        condition: service_healthy

  angular_client_prod:
    profiles: ["prod"]
    image: ghcr.io/arbobeck/saints-angular:latest
    container_name: angular-client-prod
    ports:
      - "${ANGULAR_PORT:-4200}:4200"
    networks:
      - saints-net
    environment:
      API_BASE_URL: "http://localhost:5000"
    restart: unless-stopped
    depends_on:
      saints_api_prod:
        condition: service_healthy