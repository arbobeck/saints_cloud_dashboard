networks:
  saints-net:

volumes:
  dotnet-tools:
  dotnet-packages:

services:
  saints-sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: saints-sql
    environment:
      SA_PASSWORD: ${SQL_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"
    networks:
      - saints-net
    volumes:
      - ./docs:/docs
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U ${SQL_USER} -P ${SQL_PASSWORD} -C -Q 'SELECT 1'"]
      interval: 5s
      retries: 12
      start_period: 10s
      timeout: 5s

  saints-ef:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: saints-ef
    depends_on:
      saints-sql:
        condition: service_healthy
    working_dir: /app
    volumes:
      - ./api/SaintsApi:/app
      - dotnet-tools:/root/.dotnet/tools
      - dotnet-packages:/root/.nuget/packages
    entrypoint: ["bash", "-c"]
    command: >
      "dotnet restore &&
       dotnet tool install --global dotnet-ef --version 8.0.0 2>/dev/null || echo 'EF already installed' &&
       export PATH=\"$PATH:/root/.dotnet/tools\" &&
       dotnet ef database update --connection \"Server=${SQL_SERVER},1433;Database=${SQL_DATABASE};User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True;\""
    networks:
      - saints-net

  saints-seed:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: saints-seed
    depends_on:
      saints-ef:
        condition: service_completed_successfully
    volumes:
      - ./docs:/docs
    entrypoint: ["bash", "-c"]
    command: >
      "until /opt/mssql-tools18/bin/sqlcmd -S ${SQL_SERVER} -U ${SQL_USER} -P ${SQL_PASSWORD} -C -Q 'SELECT 1 FROM ${SQL_DATABASE}.INFORMATION_SCHEMA.TABLES WHERE TABLE_NAME = ''Saints''' &> /dev/null
       do
         echo 'Waiting for Saints table...'
         sleep 2
       done &&
       echo 'Running seed script...' &&
       /opt/mssql-tools18/bin/sqlcmd -S ${SQL_SERVER} -U ${SQL_USER} -P ${SQL_PASSWORD} -C -i /docs/seed_saints_history.sql &&
       echo 'Seed complete!'"
    networks:
      - saints-net

  saints-tests:
    profiles: ["dev"]
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: saints-tests
    working_dir: /app
    volumes:
      - ./api:/app
      - dotnet-packages:/root/.nuget/packages
    command: >
      bash -c "dotnet restore && dotnet build && dotnet test --logger console"
    networks:
      - saints-net

  saints-api-dev:
    profiles: ["dev"]
    image: mcr.microsoft.com/dotnet/sdk:8.0
    container_name: saints-api
    depends_on:
      saints-sql:
        condition: service_healthy
      saints-seed:
        condition: service_completed_successfully
      saints-tests:
        condition: service_completed_successfully
    working_dir: /app
    volumes:
      - ./api/SaintsApi:/app
      - dotnet-packages:/root/.nuget/packages
    entrypoint: ["bash", "-c"]
    command: >
      "dotnet restore &&
       dotnet build &&
       dotnet run --urls http://0.0.0.0:5000"
    ports:
      - "5000:5000"
    networks:
      - saints-net
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__SaintsDb: "Server=${SQL_SERVER},1433;Database=${SQL_DATABASE};User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True;"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/saints || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  saints-api-prod:
    profiles: ["prod"]
    image: ghcr.io/arbobeck/saints-api:latest
    container_name: saints-api
    depends_on:
      saints-sql:
        condition: service_healthy
      saints-seed:
        condition: service_completed_successfully
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:5000"
      ConnectionStrings__SaintsDb: "Server=${SQL_SERVER},1433;Database=${SQL_DATABASE};User Id=${SQL_USER};Password=${SQL_PASSWORD};TrustServerCertificate=True;"
    ports:
      - "5000:5000"
    networks:
      - saints-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/saints || exit 1"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 5s

  angular-client-dev:
    profiles: ["dev"]
    build:
      context: ./ui/saints-ui
      args:
        API_BASE_URL: ${API_BASE_URL}
    container_name: angular-client
    ports:
      - "${ANGULAR_PORT}:4200"
    networks:
      - saints-net
    depends_on:
      saints-api-dev:
        condition: service_healthy

  angular-client-prod:
    profiles: ["prod"]
    image: ghcr.io/arbobeck/saints-angular:latest
    container_name: angular-client
    ports:
      - "${ANGULAR_PORT}:4200"
    networks:
      - saints-net
    environment:
      API_BASE_URL: "http://localhost:5000"
    restart: unless-stopped
    depends_on:
      saints-api-prod:
        condition: service_healthy